{{ define "step-progress" }}
<div class="step-progress" hidden>
  <div class="step-progress-meta">
    <span id="{{ .Prefix }}-progress-label" class="step-progress-meta-label"></span>
    <span id="{{ .Prefix }}-progress-state" class="step-progress-meta-state"></span>
  </div>
  <div class="step-progress-bar">
    <div id="{{ .Prefix }}-progress-fill" class="step-progress-fill" style="width: 0"></div>
  </div>
  <div class="step-progress-aside" id="{{ .Prefix }}-aside" hidden></div>
</div>
{{ end }}

{{ define "wizard-shell" }}
<main class="wizard-page">
  <p id="{{ .Prefix }}-top-error" class="wizard-btn wizard-btn-danger wizard-error-slot"></p>
  {{ template "step-progress" (dict "Prefix" .Prefix) }}
  <form id="{{ .Prefix }}-form" hidden novalidate>
    <div id="{{ .Prefix }}-stage"></div>
    <p id="{{ .Prefix }}-status" class="meta-text" hidden></p>
  </form>
  <p id="{{ .Prefix }}-loading" class="meta-text">Loading...</p>
</main>

<footer class="sticky-actions" id="{{ .Prefix }}-sticky" hidden>
  <button class="wizard-btn wizard-btn-dark" id="{{ .Prefix }}-back" type="button">INDIETRO</button>
  <button class="wizard-btn wizard-btn-primary" id="{{ .Prefix }}-next" type="submit" form="{{ .Prefix }}-form">
    <span id="{{ .Prefix }}-next-label">AVANTI</span>
    <span data-wizard-next-icon="default">{{ template "icon-arrow-right" . }}</span>
    <span data-wizard-next-icon="edit" hidden>{{ template "icon-bolt" . }}</span>
  </button>
</footer>
{{ end }}
