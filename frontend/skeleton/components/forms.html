{{ define "field" }}
<div class="form-field">
  <label class="form-field-label"{{- if .ID }} for="{{ .ID }}"{{ end }}>
    {{- if not .HideLabel }}
    <span>{{ .Label }}</span>
    {{- end }}
    <input
      id="{{ .ID }}"
      type="{{ .Type }}"
      name="{{ .Name }}"
      {{- if .HideLabel }} aria-label="{{ .Label }}"{{ end }}
      {{- if .Placeholder }} placeholder="{{ .Placeholder }}"{{ end }}
      {{- if .Required }} required{{ end }}
      {{- if .Autocomplete }} autocomplete="{{ .Autocomplete }}"{{ end }}
    />
  </label>
  <div class="form-field-status-slot">
    <p{{ if .ErrorID }} id="{{ .ErrorID }}"{{ end }} class="form-field-status meta-text is-error" hidden></p>
  </div>
</div>
{{ end }}
