{{ define "battleplan-content" }}
<div class="battleplan-page">
  <header class="dashboard-hero" id="battleplan-hero" hidden>
    <h1 class="dashboard-title" id="battleplan-hero-title"></h1>
  </header>
  <a class="wizard-btn wizard-btn-primary" id="battleplan-empty-new" href="/me/battleplan/new/" data-wizard-new hidden></a>
  <section class="battleplan-section" id="battleplan-active-section" hidden>
    <p class="battleplan-list-section-label battleplan-list-section-label-active" id="battleplan-active-label" hidden></p>
    <section id="battleplan-active" class="list-card list-card-default list-card-flush" hidden></section>
    <div class="battleplan-active-actions" id="battleplan-active-actions" hidden>
      <button type="button" class="wizard-btn wizard-btn-outline" id="battleplan-active-duplicate"></button>
      <button type="button" class="wizard-btn wizard-btn-primary" id="battleplan-active-new"></button>
    </div>
  </section>
  <section class="battleplan-section" id="battleplan-draft-section" hidden>
    <p class="battleplan-list-section-label" id="battleplan-draft-label" hidden></p>
    <section id="battleplan-draft" class="list-card list-card-default list-card-flush list-card-flush-first" hidden></section>
  </section>
  <section class="battleplan-section" id="battleplan-archive-section" hidden>
    <p class="battleplan-list-section-label" id="battleplan-archive-label" hidden></p>
    <p id="battleplan-status" class="meta-text"></p>
    <section id="battleplan-list" class="list-card list-card-default list-card-flush list-card-flush-first" hidden></section>
  </section>
  <section id="battleplan-placeholder" class="empty-state empty-state-icon-only" aria-label="Battleplan" hidden>
    <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/><path d="M8 13A5 5 0 1 1 8 3a5 5 0 0 1 0 10m0 1A6 6 0 1 0 8 2a6 6 0 0 0 0 12"/><path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8"/><path d="M9.5 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/></svg>
    <p class="empty-state-label" id="battleplan-placeholder-label"></p>
  </section>
</div>
{{ end }}
