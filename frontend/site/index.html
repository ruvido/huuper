
<!doctype html>
<html lang="en">
  
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Huuper</title>
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />
  <script src="/copy/brand.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script src="/assets/js/core/topbar.js" defer></script>
  <script src="/assets/js/core/auth.js" defer></script>
  <script src="/assets/js/public/login.js" defer></script>
</head>

  <body>
    <main class="app">
      <section class="app-shell">
        
          
<header class="top-bar">
  
    <span></span>
  
  <div class="top-bar-title">REALMEN</div>
  
    <span></span>
  
</header>

        
        
<section class="panel">
  <form id="login-form">
    <div class="view-stack">
      
<label class="form-field">
  <span>Email</span>
  <input
    id="login-email"
    type="email"
    name="email" placeholder="name@domain.com" required autocomplete="username"
  />
</label>

      
<label class="form-field">
  <span>Password</span>
  <input
    id="login-password"
    type="password"
    name="password" placeholder="password" required autocomplete="current-password"
  />
</label>

    </div>
    <p id="login-error" class="meta-text" hidden></p>
    <div class="action-row">
      <button class="primary" type="submit">Login</button>
      <a href="/signup/">Signup</a>
      <a href="/password-reset/">Password reset</a>
    </div>
  </form>
</section>

      </section>
    </main>
  
  <script src="/assets/js/core/hot-reload.js" defer></script>
</body>
</html>
