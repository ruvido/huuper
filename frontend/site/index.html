
<!doctype html>
<html lang="it">
  
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Huuper</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script src="/assets/js/auth.js" defer></script>
  <script src="/assets/js/login.js" defer></script>
</head>

  <body>
    <main class="app">
      <section class="shell">
        
        
<section class="panel">
  <form id="login-form">
    <div class="stack">
      
<label class="field">
  <span>Email</span>
  <input
    id="login-email"
    type="email"
    name="email" placeholder="nome@dominio.it" required autocomplete="username"
  />
</label>

      
<label class="field">
  <span>Password</span>
  <input
    id="login-password"
    type="password"
    name="password" placeholder="password" required autocomplete="current-password"
  />
</label>

    </div>
    <p id="login-error" class="status" hidden></p>
    <div class="actions">
      <button class="primary" type="submit">Login</button>
      <a href="/signup/">Signup</a>
      <a href="/password-reset/">Password reset</a>
    </div>
  </form>
</section>

      </section>
    </main>
  
  <script src="/assets/js/hot-reload.js" defer></script>
</body>
</html>
