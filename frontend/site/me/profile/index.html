<script>
  (() => {
    const expectedScope = "me";
    const storageKey = "huuper.auth";
    let auth = null;
    try {
      const raw = localStorage.getItem(storageKey);
      auth = raw ? JSON.parse(raw) : null;
    } catch (_) {
      auth = null;
    }

    if (!auth || !auth.token) {
      window.location.replace("/");
      return;
    }

    const actualScope = auth && auth.model && auth.model.admin === true ? "admin" : "me";
    if (actualScope !== expectedScope) {
      window.location.replace(actualScope === "admin" ? "/admin/" : "/me/");
    }
  })();
</script>
