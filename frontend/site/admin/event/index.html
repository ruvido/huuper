<script>
  (() => {
    const expectedScope = "admin";
    const storageKey = "huuper.auth";
    const currentPath = window.location.pathname + window.location.search + window.location.hash;

    function scopeRedirectPath(scope, next) {
      const raw = String(next || "").trim();
      if (!raw || raw.startsWith("//")) {
        return "";
      }

      let url;
      try {
        url = new URL(raw, window.location.origin);
      } catch (_) {
        return "";
      }
      if (url.origin !== window.location.origin) {
        return "";
      }

      const normalized = url.pathname + url.search + url.hash;
      if (scope === "admin" && normalized.startsWith("/me/")) {
        return "/admin/" + normalized.slice("/me/".length);
      }
      if (scope === "me" && normalized.startsWith("/admin/")) {
        return "/me/" + normalized.slice("/admin/".length);
      }
      if (normalized.startsWith(scope === "admin" ? "/admin/" : "/me/")) {
        return normalized;
      }
      return "";
    }

    let auth = null;
    try {
      const raw = localStorage.getItem(storageKey);
      auth = raw ? JSON.parse(raw) : null;
    } catch (_) {
      auth = null;
    }

    if (!auth || !auth.token) {
      const target = new URL("/", window.location.origin);
      target.searchParams.set("next", currentPath);
      window.location.replace(target.pathname + target.search + target.hash);
      return;
    }

    const actualScope = auth && auth.model && auth.model.admin === true ? "admin" : "me";
    if (actualScope !== expectedScope) {
      const target = scopeRedirectPath(actualScope, currentPath);
      window.location.replace(target || (actualScope === "admin" ? "/admin/" : "/me/"));
    }
  })();
</script>
