
<!doctype html>
<html lang="en">
  
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Huuper / Signup</title>
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" />
  <script src="/copy/brand.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script src="/assets/js/core/topbar.js" defer></script>
  <script src="/assets/js/public/signup.js" defer></script>
</head>

  <body>
    <main class="app">
      <section class="app-shell">
        
          
<header class="top-bar">
  
    <a class="topbar-back" href="/" aria-label="Back"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/></svg></a>
  
  <div class="top-bar-title">Signup</div>
  
    <span></span>
  
</header>

        
        
<section class="panel">
  <form id="signup-form">
    <div class="view-stack">
      
<label class="form-field">
  <span>Email</span>
  <input
    id="signup-email"
    type="email"
    name="email" placeholder="name@domain.com" required autocomplete="email"
  />
</label>

      
<label class="form-field">
  <span>Password</span>
  <input
    id="signup-password"
    type="password"
    name="password" placeholder="password" required autocomplete="new-password"
  />
</label>

      
<label class="form-field">
  <span>Password confirm</span>
  <input
    id="signup-password-confirm"
    type="password"
    name="passwordConfirm" placeholder="password" required autocomplete="new-password"
  />
</label>

    </div>
    <p id="signup-status" class="meta-text" hidden></p>
    <div class="action-row">
      <button class="primary" type="submit">Signup</button>
      <a href="/">Login</a>
    </div>
  </form>
</section>

      </section>
    </main>
  
  <script src="/assets/js/core/hot-reload.js" defer></script>
</body>
</html>
